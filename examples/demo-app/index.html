<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CE Demo App</title>
    <style>
      :root { font-family: system-ui, sans-serif; }
      body { margin: 0; }
      header {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.75rem 1rem;
        background: #1e293b;
        color: white;
      }
      #nav-toggle {
        background: #334155;
        color: white;
        border: none;
        border-radius: 6px;
        padding: 0.5rem 0.9rem;
        cursor: pointer;
      }
      #nav-menu {
        display: none;
        flex-direction: column;
        position: absolute;
        top: 3.5rem;
        left: 1rem;
        background: white;
        color: #0f172a;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.15);
        min-width: 12rem;
      }
      #nav-menu.open { display: flex; }
      #nav-menu a { padding: 0.6rem 1rem; text-decoration: none; color: inherit; }
      #nav-menu a:hover { background: #f1f5f9; }
      main { padding: 1.5rem; }
      #count { font-size: 2rem; font-weight: 600; }
    </style>
  </head>
  <body>
    <header>
      <button id="nav-toggle" aria-expanded="false">Menu</button>
      <span>CE Demo App</span>
    </header>

    <nav id="nav-menu" aria-label="Main navigation">
      <a href="#dashboard">Dashboard</a>
      <a href="#reports">Reports</a>
      <a href="#settings">Settings</a>
    </nav>

    <main>
      <h1>Demo application</h1>
      <p>This app is the verification target for the Continuous Evidence spike. It intentionally knows nothing about CE.</p>
      <button id="increment">Increment</button>
      <output id="count">0</output>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
